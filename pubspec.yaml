name: csuatlasf
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.8.2
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.7
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  printing: ^5.11.1
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Pins image to a version compatible with archive 4.0.9
dependency_overrides:
  image: 4.5.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: FormSans
      fonts:
        - asset: assets/fonts/FormSans-Regular.ttf
        - asset: assets/fonts/FormSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/FormSans-Italic.ttf
          style: italic
        - asset: assets/fonts/FormSans-BoldItalic.ttf
          weight: 700
          style: italic
    - family: FormSerif
      fonts:
        - asset: assets/fonts/FormSerif-Regular.ttf
        - asset: assets/fonts/FormSerif-Bold.ttf
          weight: 700
        - asset: assets/fonts/FormSerif-Italic.ttf
          style: italic